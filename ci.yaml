name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# required to write releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        # Not pinned on purpose: track current LTS. Latest known working major version: 24
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript compilation
        run: npm run compile

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        # Not pinned on purpose: track current LTS. Latest known working major version: 24
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create VS Code extension package
        run: npm run package

      - name: Compute CalVer date
        run: echo "RELEASE_DATE=$(date +%Y.%m.%d)" >> "$GITHUB_ENV"

      # Same-day rebuilds update this release in place instead of creating a new one.
      # Releases are only published from pushes to main; PRs verify packaging only.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_DATE }}
          name: git-buttons v${{ env.RELEASE_DATE }}
          files: '*.vsix'
          overwrite: true
          delete_old_artifacts: true
          make_latest: true
          fail_on_unmatched_files: true

      # Keep only the 3 newest releases so cumulative asset size stays bounded
      # against the repository storage quota.
      - name: Keep last 3 releases
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gh release list --limit 4 | tail -n +2 | cut -f1 | xargs -rn1 gh release delete --cleanup-tag
